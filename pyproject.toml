[project]
name = "terraform-aws-metrics-lambda"
dynamic = ["version"]
description = "odin metriczzz"
authors = [{ name = "spine core" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "MIT"

[project.urls]
Repository = "https://github.com/NHSDigital/terraform-aws-metrics-lambda"

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.2.1",
    "httpx>=0.28.1",
    "pytest-httpx>=0.36.2",
    "pytest-httpserver>=1.1.2",
    "ruff>=0.15.10",
    "petname>=2.6",
    "black>=25.12.0",
    "boto3>=1.42.88",
    "moto>=5.1.10",
    "pyparsing>=3.3.1",
    "types-python-dateutil>=2.9.0.20260408",
    "aws-lambda-powertools>=3.27.0",
]
local = ["ipython>=9.8.0"]

[tool.uv]
package = false
default-groups = "all"

[tool.ruff]
lint.select = [
    # See https://beta.ruff.rs/docs/rules/ for a full list
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "Q", # flake8-quotes
    "YTT", # flake8-2020
    "RSE", # flake8-raise
    "T10", # flake8-debugger
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "PIE", # flake8-pie
    "EXE", # flake8-executable
    "A", # flake8-builtins
    "UP",  # pyupgrade
    "PT", # flake8-pytest-style
    "PERF", # Perflint #
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
]
lint.ignore = [
    "SIM112"  # casing on environment variables
]
lint.unfixable = ["SIM112"]
src = ["."]
exclude = [
    ".git",
    ".venv",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
check_untyped_defs = true
exclude = [
    "build",
    "dist",
]

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "moto.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_classes = "NoTestClasses"
python_files = "*_test.py test_*.py *_tests.py"
norecursedirs = ".git .venv .eggs build dist .tox"
testpaths = [
    "tests",
]

[tool.coverage.run]
branch = true
omit = [
    ".venv/*",
    ".tox/*",
    "tests/*",
]
source = [
    "."
]


[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
    "pragma: no cover",
    "from .*",
    "import .*"
]
omit = [
    "tests/*",
]
sort = "-cover"
ignore_errors = true
precision = 2
fail_under = 55
show_missing = true

[tool.coverage.xml]
output = "reports/coverage.xml"


[tool.uv-dynamic-versioning]
strict = true
enable = true
metadata = false
pattern = 'v(?P<base>\d+\.\d+\.\d+)'
vcs = "git"
style = "pep440"
format-jinja = """
    {%- if distance == 0 -%}
        {{ serialize_pep440(base, stage, revision) }}
    {%- else -%}
        {{ serialize_pep440(bump_version(base), "pre", revision=timestamp) }}
    {%- endif -%}
"""


[tool.hatch.version]
source = "uv-dynamic-versioning"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
