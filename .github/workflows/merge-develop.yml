name: odin-merge
on:
  push:
    branches:
      - develop

jobs:

  scan:
    runs-on: ubuntu-latest

    steps:

      - name: checkout the calling repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: build-common
        uses: ./.github/actions/build-common

      - name: run tests
        shell: bash
        run: |
          make coverage-ci

      - name: convert sonar reports
        if: ${{ hashFiles('./reports/junit/*.xml') || hashFiles('./reports/coverage.xml') }}
        uses: ./.github/actions/sonar-reports

      - name: prepare sonar properties
        if: ${{ hashFiles('./sonar-project.properties') }}
        uses: ./.github/actions/sonar-properties

      - name: sonarqube scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  tag-version:
    runs-on: ubuntu-latest

    timeout-minutes: 30
    steps:
      - name: checkout the calling repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: get uv version
        id: uv-version
        shell: bash
        run: |
          if [ -f .tool-versions ] && grep -Eq "^uv .*" .tool-versions; then
            version="$(grep -E '^uv .*' .tool-versions | sed -E 's#.*\s##')"
          else
            version="0.11.28"
          fi
          echo "version=${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: install mise / uv
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # 4.2.0
        with:
          install: true
          cache: true
          tool_versions: |
            uv ${{ steps.uv-version.outputs.version }}
          reshim: true
          github_token: ${{ inputs.github-token }}

      - name: uv get release version
        shell: bash
        id: get-version
        run: |
          VERSION="v$(uvx --no-build hatch@1.17.1 version | sed -E 's#rc.*$##')"
          echo "VERSION=${VERSION}"
          if [ -z "${VERSION}" ]; then
          exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: increment patch version and replace major version
        shell: bash
        id: get-version
        run: |
          # Create semantic version tag: vN.N.N
          SEMANTIC_VERSION="${{ steps.get-version.outputs.version }}"
          git tag "${SEMANTIC_VERSION}"
          git push origin "${SEMANTIC_VERSION}"

          # Delete existing major version tag if it already exists: vN
          MAJOR_VERSION="$(echo ${SEMANTIC_VERSION} | cut -d. -f1)"
          if [[ $(git tag --list ${MAJOR_VERSION}) != "" ]]; then
            git tag -d ${MAJOR_VERSION}
            git push origin :refs/tags/${MAJOR_VERSION}
          fi

          # Create major version tag
          git tag "${MAJOR_VERSION}"
          git push origin "${MAJOR_VERSION}"
